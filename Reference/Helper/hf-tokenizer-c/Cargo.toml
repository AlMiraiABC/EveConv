[package]
name = "hf-tokenizers-c"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
ahash = "0.8.12"

[build-dependencies]
csbindgen = "1.9.6"
